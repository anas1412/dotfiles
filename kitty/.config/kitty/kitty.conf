# Tab Bar
tab_bar_edge left
tab_bar_style powerline
active_tab_foreground #000000
active_tab_background #E8A840
inactive_tab_foreground #666666
inactive_tab_background #1a1a1a

# Window Padding
window_padding_width 15

# Window Decorations & Opacity
# (Note: "blur" support depends on your window manager/OS)
hide_window_decorations no
background_opacity 0.55
background_blur 1

# Font Configuration
font_size 10.0
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# Default Window Size (Columns x Lines)
remember_window_size  no
initial_window_width  95c
initial_window_height 28c

# Keyboard Bindings
# Sends the escape sequence for Shift+Return
map shift+enter send_text all \x1b\r
